<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - ReparaTech</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>ReparaTech</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="seguimiento.html">Seguimiento</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="login.html">Acceso taller</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Ingresa tu equipo</h2>
      <p>Completa el formulario para dejar tu dispositivo a reparación.</p>

      <form id="contactForm" novalidate>
        <div id="formMsg" class="form-msg" role="status" aria-live="polite"></div>

        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" autocomplete="name">
          <span class="error-msg" id="error-nombre"></span>
        </div>

        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" autocomplete="email">
          <span class="error-msg" id="error-email"></span>
        </div>

        <div class="campo">
          <label for="dispositivo">Dispositivo (marca y modelo)</label>
          <input type="text" id="dispositivo" name="dispositivo" list="modelos-sugeridos" autocomplete="off" placeholder="Ej: iPhone 12">
          <datalist id="modelos-sugeridos">
            <option value="iPhone 12">
            <option value="Samsung S21">
            <option value="Laptop genérica">
          </datalist>
          <span class="hint">Empieza a escribir y aparecen sugerencias.</span>
          <span class="error-msg" id="error-dispositivo"></span>
        </div>

        <div class="campo">
          <label for="servicio">Servicio solicitado</label>
          <select id="servicio" name="servicio">
            <option value="">Selecciona una opción</option>
            <option value="SE001">SE001 · Diagnóstico</option>
            <option value="SE002">SE002 · Reparación de pantalla</option>
            <option value="SE003">SE003 · Reparación de batería</option>
          </select>
          <span class="error-msg" id="error-servicio"></span>
        </div>

        <button type="submit">Enviar</button>
      </form>
      </section>
  </main>

  <footer>
    <p>ReparaTech - Santiago Centro</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
